<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>శకారంభం — Digital Book</title>
  <link rel="stylesheet" href="styles.css?v=home-mobile-20260928">
</head>
<body>
  <div class="page">
    <header class="top-fixed">
      <img src="assets/top-bar.jpg" alt="Shakarambham top banner">
    </header>

    <nav class="nav-fixed">
      <a class="active" href="index.html">⌂ Home</a>
      <a href="author.html">Author</a>
    </nav>

    <main class="content">
      <section class="hero">
        <img src="assets/banner.jpg" alt="Shakarambham">
      </section>

      <section class="actions">
        <article class="card">
          <div class="icon red">▤</div>
          <div>
            <h2>Read the Book Online</h2>
            <p>Browse all 127 pages with a smooth and easy reading experience.</p>
            <a class="btn red-btn" href="read.html">Read Book →</a>
          </div>
        </article>

        <article class="card">
          <div class="icon yellow">⇩</div>
          <div class="download">
            <h2>Download PDF</h2>
            <p>Download the Shakarambham book in Telugu or English.</p>

            <div class="controls">
              <select id="downloadLanguage">
                <option value="">Select Language</option>
                <option value="te">తెలుగు — Telugu</option>
                <option value="en">English</option>
              </select>

              <button class="btn yellow-btn" id="downloadBtn" type="button">
                ⇩ Download PDF
              </button>
            </div>
          </div>
        </article>
      </section>

    <div id="siteViews" aria-label="Site views" style="min-height:28px;margin:10px 0 16px;text-align:center;color:#5b6b82;font-size:14px;font-weight:700;">
      👁️ Views: <span id="siteViewsCount">—</span>
    </div>
    </main>

    <footer class="bottom-fixed">
      <img src="assets/bottom-bar.jpg" alt="Shakarambham bottom banner">
    </footer>
  </div>
  <script src="app.js"></script>
  <script>
    (function () {
      var count = document.getElementById('siteViewsCount');
      if (!count) return;
      fetch('https://counterapi.com/api/shakarambham.in/view/site')
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data && typeof data.value !== 'undefined') {
            count.textContent = Number(data.value).toLocaleString('en-IN');
          }
        })
        .catch(function () {
          // View counter is non-critical; never affect the website if unavailable.
        });
    })();
  </script>
</body>
</html>
