<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>శకారంభం — Read Online</title><link rel="stylesheet" href="styles.css"><style>body.reader-page{overflow:hidden;background:#f4f6f8}.reader-shell{height:100vh;display:flex;flex-direction:column;background:#f4f6f8}.reader-header{height:70px;flex:0 0 70px;background:#fff;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.reader-title{color:#071b42;font-size:22px;font-weight:800}.reader-home{background:#ed1c24;color:#fff;text-decoration:none;padding:11px 18px;border-radius:7px;font-weight:700}.reader-languages{height:80px;flex:0 0 80px;background:#fff;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;justify-content:center;gap:10px}.reader-languages strong{color:#071b42;margin-right:6px}.reader-lang{border:1px solid #d4dbe7;background:#fff;color:#071b42;border-radius:7px;padding:11px 22px;font-weight:700;cursor:pointer}.reader-lang.active{background:#ffc900;border-color:#ffc900}.reader-frame-wrap{flex:1;min-height:0;padding:12px}#readerFrame{width:100%;height:100%;border:0;background:#fff}.reader-message{height:100%;display:flex;align-items:center;justify-content:center}.reader-message-box{background:#fff;border:1px solid #d9dfe8;border-radius:12px;padding:42px 60px;text-align:center;box-shadow:0 8px 28px rgba(10,30,60,.08);color:#35557e}.reader-message-box h1{color:#071b42;margin-bottom:10px}.hidden{display:none}@media(max-width:700px){.reader-header{padding:0 12px}.reader-title{font-size:17px}.reader-languages{gap:4px;overflow-x:auto;justify-content:flex-start;padding:0 8px}.reader-lang{padding:9px 12px}.reader-languages strong{white-space:nowrap}}</style></head><body class="reader-page"><div class="reader-shell"><header class="reader-header"><div class="reader-title">శకారంభం — Read Online</div><a class="reader-home" href="index.html">← Home</a></header><div class="reader-languages"><strong>Select Language:</strong><button class="reader-lang active" data-lang="te">తెలుగు</button><button class="reader-lang" data-lang="en" disabled>English (Coming Soon)</button><button class="reader-lang" data-lang="hi" disabled>हिन्दी (Coming Soon)</button><button class="reader-lang" data-lang="ta" disabled>தமிழ் (Coming Soon)</button><button class="reader-lang" data-lang="kn" disabled>ಕನ್ನಡ (Coming Soon)</button></div><div class="reader-frame-wrap"><div id="readerEmpty" class="reader-message"><div class="reader-message-box"><h1>Select a Language</h1><p>Select a language above to open that language edition.</p></div></div><iframe id="readerFrame" title="Shakarambham book reader" hidden></iframe></div></div><script src="read.js"></script></body></html>
