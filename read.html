<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>శకారంభం — Read Online</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eef1f5;font-family:Arial,"Noto Sans Telugu",sans-serif}
.reader{height:100dvh;display:flex;flex-direction:column}
.header{height:62px;flex:0 0 62px;background:#fff;border-bottom:1px solid #d6dce4;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.title{font-size:20px;font-weight:800;color:#071b42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{background:#ed1c24;color:#fff;text-decoration:none;padding:10px 16px;border-radius:7px;font-weight:700;white-space:nowrap}
.langs{min-height:58px;background:#fff;border-bottom:1px solid #d6dce4;display:flex;align-items:center;justify-content:center;gap:9px;padding:7px;overflow-x:auto}
.langs strong{color:#071b42;white-space:nowrap}
.lang{border:1px solid #cbd4e0;background:#fff;color:#071b42;border-radius:7px;padding:9px 18px;font-weight:700;white-space:nowrap}
.lang.active{background:#ffc900;border-color:#ffc900}
.viewer{position:relative;flex:1;min-height:0;background:#dfe4e9;display:flex;align-items:center;justify-content:center;padding:18px}
.openBook{display:inline-block;background:#ed1c24;color:#fff;text-decoration:none;padding:15px 28px;border-radius:8px;font-weight:800;font-size:17px}
.note{margin-top:12px;text-align:center;color:#071b42;font-size:13px}
@media(max-width:700px){
.header{height:52px;flex-basis:52px;padding:0 8px}.title{font-size:14px}.home{font-size:11px;padding:8px 10px}
.langs{min-height:54px;justify-content:flex-start;padding:6px;gap:6px}.langs strong{font-size:11px}.lang{font-size:11px;padding:8px 11px}
.openBook{font-size:15px;padding:13px 22px}.note{font-size:12px}
}
</style>
</head>
<body>
<div class="reader">
<header class="header"><div class="title">శకారంభం — Read Online</div><a class="home" href="index.html">← Home</a></header>
<div class="langs"><strong>Select Language:</strong><button class="lang active" data-lang="te" type="button">తెలుగు</button><button class="lang" data-lang="en" type="button">English</button></div>
<main class="viewer">
<div>
<a id="openBook" class="openBook" href="/read-pdf/te">Open Book</a>
<div class="note">Tap “Open Book” to read the eBook in your phone's built-in PDF viewer.</div>
</div>
</main>
</div>
<script>
(function(){
 const link=document.getElementById('openBook');
 const buttons=document.querySelectorAll('.lang');
 const urls={te:'/read-pdf/te',en:'/read-pdf/en'};
 function setBook(lang){
   buttons.forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});
   link.href=urls[lang];
 }
 buttons.forEach(function(b){b.addEventListener('click',function(){setBook(b.dataset.lang);});});
 setBook('te');
})();
</script>
</body>
</html>
