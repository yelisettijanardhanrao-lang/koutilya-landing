<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>శకారంభం — Read Online</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body.reader-page{background:#f4f6f8;font-family:Arial,"Noto Sans Telugu",sans-serif;user-select:none;-webkit-user-select:none}.reader-shell{height:100vh;display:flex;flex-direction:column}.reader-header{height:70px;flex:0 0 70px;background:#fff;border:1px solid #d8d8d8;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.reader-title{color:#071b42;font-size:22px;font-weight:800}.reader-home{background:#ed1c24;color:#fff;text-decoration:none;padding:11px 18px;border-radius:7px;font-weight:700}.reader-languages{height:80px;flex:0 0 80px;background:#fff;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;justify-content:center;gap:10px}.reader-languages strong{color:#071b42;margin-right:6px}.reader-lang{border:1px solid #d4dbe7;background:#fff;color:#071b42;border-radius:7px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:14px}.reader-lang.active{background:#ffc900;border-color:#ffc900}.reader-area{position:relative;flex:1;min-height:0;background:#e9edf1;display:flex;flex-direction:column}.reader-toolbar{height:54px;flex:0 0 54px;background:#fff;border-bottom:1px solid #cfd6df;display:flex;align-items:center;justify-content:center;gap:8px}.reader-toolbar button{border:1px solid #cbd3dd;background:#fff;border-radius:6px;padding:7px 12px;color:#071b42;font-weight:700;cursor:pointer}.reader-toolbar button:disabled{opacity:.45;cursor:not-allowed}.page-info{min-width:105px;text-align:center;color:#071b42;font-weight:700}.reader-canvas-wrap{flex:1;min-height:0;overflow:auto;text-align:center;padding:18px}.page-container{display:inline-block;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);line-height:0}.page-container canvas{display:block}.reader-message{position:absolute;inset:54px 0 0;display:flex;align-items:center;justify-content:center}.reader-message-box{background:#fff;border:1px solid #d9dfe8;border-radius:12px;padding:42px 60px;text-align:center;box-shadow:0 8px 28px rgba(10,30,60,.08);color:#35557e}.reader-message-box h1{color:#071b42;margin:0 0 10px}.reader-error{display:none;color:#b00020;background:#fff;padding:18px;text-align:center;font-weight:700}.busy{display:none;color:#35557e;font-weight:700}@media(max-width:700px){.reader-header{padding:0 12px;height:62px;flex-basis:62px}.reader-title{font-size:17px}.reader-languages{height:auto;min-height:70px;flex:0 0 auto;overflow-x:auto;justify-content:flex-start;padding:10px 8px}.reader-lang{padding:9px 12px;white-space:nowrap}.reader-languages strong{white-space:nowrap}.reader-toolbar{height:50px;flex-basis:50px}.reader-canvas-wrap{padding:8px}.reader-message{inset:50px 0 0}.reader-message-box{padding:28px 20px}}
</style>
</head>
<body class="reader-page">
<div class="reader-shell">
<header class="reader-header"><div class="reader-title">శకారంభం — Read Online</div><a class="reader-home" href="index.html">← Home</a></header>
<div class="reader-languages"><strong>Select Language:</strong><button type="button" class="reader-lang active" data-lang="te">తెలుగు</button><button type="button" class="reader-lang" data-lang="en">English</button><button type="button" class="reader-lang" data-lang="hi">हिन्दी</button><button type="button" class="reader-lang" data-lang="ta">தமிழ்</button><button type="button" class="reader-lang" data-lang="kn">ಕನ್ನಡ</button></div>
<section class="reader-area">
<div class="reader-toolbar"><button id="prevBtn" type="button">← Previous</button><div class="page-info"><span id="pageNum">1</span> / <span id="pageCount">—</span></div><button id="nextBtn" type="button">Next →</button><button id="zoomOut" type="button">−</button><button id="zoomReset" type="button">100%</button><button id="zoomIn" type="button">+</button></div>
<div id="readerMessage" class="reader-message"><div class="reader-message-box"><h1>Loading…</h1><p class="busy">Please wait.</p></div></div>
<div id="readerError" class="reader-error"></div>
<div id="canvasWrap" class="reader-canvas-wrap" hidden><div id="pageContainer" class="page-container"><canvas id="pdfCanvas"></canvas></div></div>
</section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script src="read.js" type="module"></script>
</body>
</html>
