<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>శకారంభం — Read Online</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, "Noto Sans Telugu", sans-serif;
    background: #f5f6f8;
    color: #071b45;
}

/* TOP HEADER */
.read-header {
    width: 100%;
    height: 70px;
    background: #ffffff;
    border: 1px solid #d9dee7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
}

.read-title {
    font-size: 22px;
    font-weight: 700;
    color: #071b45;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 100px;
    height: 40px;
    padding: 0 18px;
    border-radius: 7px;
    background: #f51d29;
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
}

/* LANGUAGE BAR */
.language-bar {
    width: 100%;
    min-height: 80px;
    background: #ffffff;
    border-left: 1px solid #d9dee7;
    border-right: 1px solid #d9dee7;
    border-bottom: 1px solid #d9dee7;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px;
}

.language-label {
    font-size: 16px;
    font-weight: 700;
    margin-right: 8px;
}

.language-btn {
    height: 42px;
    min-width: 95px;
    padding: 0 18px;

    background: #ffffff;
    border: 1px solid #d2d9e5;
    border-radius: 6px;

    color: #071b45;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;
    transition: 0.2s ease;
}

.language-btn:hover {
    border-color: #f5c400;
    background: #fff8d6;
}

.language-btn.active {
    background: #ffc900;
    border-color: #ffc900;
    color: #071b45;
}

/* MESSAGE AREA */
.reader-area {
    min-height: calc(100vh - 150px);
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

.message-card {
    width: 550px;
    max-width: 100%;

    background: #ffffff;
    border: 1px solid #d9dee7;
    border-radius: 10px;

    padding: 40px 35px;

    text-align: center;

    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

.message-card h1 {
    margin: 0 0 12px;
    font-size: 24px;
    color: #071b45;
}

.message-card p {
    margin: 0;
    color: #5b6b88;
    font-size: 16px;
    line-height: 1.5;
}

/* PDF VIEWER */
.pdf-viewer {
    display: none;
    width: 100%;
    height: calc(100vh - 150px);
    border: 0;
    background: #ffffff;
}

/* MOBILE */
@media (max-width: 700px) {

    .read-header {
        height: 62px;
        padding: 0 12px;
    }

    .read-title {
        font-size: 18px;
    }

    .home-btn {
        min-width: 80px;
        height: 36px;
        padding: 0 12px;
        font-size: 14px;
    }

    .language-bar {
        flex-wrap: wrap;
        min-height: auto;
        padding: 12px 8px;
        gap: 6px;
    }

    .language-label {
        width: 100%;
        text-align: center;
        margin: 0 0 5px;
    }

    .language-btn {
        min-width: 70px;
        height: 38px;
        padding: 0 10px;
        font-size: 13px;
    }

    .reader-area {
        min-height: calc(100vh - 135px);
        padding: 15px;
    }

    .message-card {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="read-header">

    <div class="read-title">
        శకారంభం — Read Online
    </div>

    <a href="index.html" class="home-btn">
        ← Home
    </a>

</header>


<!-- LANGUAGE SELECTION -->
<section class="language-bar">

    <span class="language-label">
        Select Language:
    </span>

    <button
        type="button"
        class="language-btn"
        data-pdf="assets/pdfs/telugu.pdf">
        తెలుగు
    </button>

    <button
        type="button"
        class="language-btn"
        data-pdf="assets/pdfs/english.pdf">
        English
    </button>

    <button
        type="button"
        class="language-btn"
        data-pdf="assets/pdfs/hindi.pdf">
        हिन्दी
    </button>

    

    

</section>


<!-- INITIAL MESSAGE -->
<main class="reader-area" id="messageArea">

    <div class="message-card">

        <h1>Select a Language</h1>

        <p>
            Select your preferred language to open the book.
        </p>

    </div>

</main>


<!-- PDF VIEWER -->
<iframe
    id="pdfViewer"
    class="pdf-viewer"
    title="Shakarambham Digital Book">
</iframe>


<script>

const languageButtons =
    document.querySelectorAll(".language-btn");

const messageArea =
    document.getElementById("messageArea");

const pdfViewer =
    document.getElementById("pdfViewer");


languageButtons.forEach(function(button) {

    button.addEventListener("click", function() {

        const pdfFile =
            this.getAttribute("data-pdf");

        if (!pdfFile) {
            return;
        }

        /*
         * Highlight selected language
         */
        languageButtons.forEach(function(btn) {
            btn.classList.remove("active");
        });

        this.classList.add("active");


        /*
         * Open selected language PDF
         * inside the browser viewer.
         */
        messageArea.style.display = "none";

        pdfViewer.style.display = "block";

        pdfViewer.src = pdfFile;

    });

});

</script>

</body>
</html>
